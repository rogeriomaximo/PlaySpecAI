<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- ia que recomenda jogos para o seu PC com base na sua configuração e orçamento. Pergunte sobre jogos que rodam no seu PC, jogos abaixo de um certo preço, ou quais oferecem mais FPS. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play Spec AI</title>
  <link rel="stylesheet" href="style.css" />
  <script>window.PLAYSPEC_API_BASE = "https://iagames.onrender.com";</script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M6 12h4M8 10v4"/><circle cx="15.5" cy="11" r=".6" fill="currentColor"/><circle cx="17.5" cy="13" r=".6" fill="currentColor"/></svg>
      </div>
      <div class="brand">
        <h1>Play Spec <span>AI</span></h1>
        <p>Gaming recommendation assistant</p>
      </div>
      
    </header>

    <section class="chat-head">
      <div class="title">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>
        <h2>Nova conversa</h2>
      </div>
      <button type="button" id="newChat" class="link-btn">+ Nova conversa</button>
    </section>

    <main id="messages" class="messages" aria-live="polite"></main>

    <footer class="bottom">
      <h3>Experimente perguntar</h3>
      <div class="chips" id="chips">
        <button type="button" class="chip">Quais jogos rodam no meu PC?</button>
        <button type="button" class="chip">Quero jogos abaixo de R$ 50</button>
        <button type="button" class="chip">Quais oferecem mais FPS?</button>
      </div>

      <form id="form" class="composer" autocomplete="off">
        <textarea id="input" rows="1" maxlength="500" placeholder="Converse com o Play Spec AI..."></textarea>
        <div class="composer-row">
          <button type="button" id="openConfig" class="link-btn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
            Configurar PC
          </button>
          <button type="submit" id="send" class="send" aria-label="Enviar" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </form>
    </footer>
  </div>

  <dialog id="configDialog">
    <form method="dialog" id="configForm">
      <h2>Configurar PC</h2>
      <p class="hint">Essas informações ficam salvas apenas no seu navegador.</p>

      <label>Placa de vídeo (GPU)
        <input id="cfgGpu" list="gpuList" placeholder="Ex.: RTX 3060, GTX 1650, RX 580" required />
        <datalist id="gpuList">
          <option value="GTX 1050 Ti"><option value="GTX 1060"><option value="GTX 1650"><option value="GTX 1660 Super">
          <option value="RTX 2060"><option value="RTX 3050"><option value="RTX 3060"><option value="RTX 3070">
          <option value="RTX 4060"><option value="RTX 4070"><option value="RTX 5060">
          <option value="RX 580"><option value="RX 6600"><option value="RX 7600">
          <option value="Intel UHD Graphics"><option value="Radeon Vega 8">
        </datalist>
      </label>

      <!-- A API exige CPU, então deixou de ser opcional -->
      <label>Processador (CPU)
        <input id="cfgCpu" placeholder="Ex.: Ryzen 5 5600, Core i5-12400" required />
      </label>

      <div class="grid2">
        <label>Memória RAM (GB)
          <select id="cfgRam" required>
            <option value="">Selecione</option>
            <option>4</option><option>8</option><option>12</option><option>16</option><option>32</option><option>64</option>
          </select>
        </label>
        <label>Orçamento (R$)
          <input id="cfgBudget" type="number" min="0" step="1" placeholder="Ex.: 100" required />
        </label>
      </div>

      <div class="grid2">
        <label>Tipo da RAM (opcional)
          <select id="cfgDdr">
            <option value="">Não sei</option>
            <option>DDR3</option><option>DDR4</option><option>DDR5</option>
          </select>
        </label>
        <label>Frequência em MHz (opcional)
          <input id="cfgMhz" type="number" min="0" step="1" placeholder="Ex.: 3200" />
        </label>
      </div>

      <div class="actions">
        <button type="button" id="cfgCancel" class="ghost">Cancelar</button>
        <button type="submit" class="primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
